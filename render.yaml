# Blueprint Render — service web KBForms (Docker, plan gratuit).
# La base MySQL n'est PAS gérée ici (Render ne fait pas de MySQL gratuit) :
# créer une base sur Aiven (gratuit, sans carte) et renseigner KBF_DB_* dans
# le dashboard Render. Voir tools/DEPLOY_RENDER.md.
#
# Les variables `sync: false` ne sont PAS stockées dans le dépôt : les saisir
# dans Render → service → Environment.

services:
  - type: web
    name: kbforms
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /auth/config    # public, renvoie 200, sans accès base → health check fiable
    envVars:
      - key: KBF_BASE_URL            # ex. https://kbforms.onrender.com
        sync: false
      - key: KBF_DB_HOST             # hôte MySQL Aiven (mysql-xxxx.aivencloud.com)
        sync: false
      - key: KBF_DB_PORT             # port Aiven (5 chiffres, PAS 3306)
        sync: false
      - key: KBF_DB_NAME             # "defaultdb" chez Aiven
        sync: false
      - key: KBF_DB_USER             # "avnadmin" chez Aiven
        sync: false
      - key: KBF_DB_PASS
        sync: false
      - key: KBF_DB_SSL_NO_VERIFY    # "1" : TLS obligatoire vers Aiven, sans vérifier le CA privé (suffisant pour un pilote)
        value: "1"
      - key: KBF_MOBILE_CLIENT_SECRET
        sync: false
      - key: MAIL_DRIVER            # 'brevo' : API HTTP (port 443) — Render bloque le SMTP sortant
        value: brevo
      - key: MAIL_BREVO_API_KEY    # clé "xkeysib-…" créée sur brevo.com (SMTP & API → API Keys)
        sync: false
      - key: MAIL_FROM_EMAIL       # expéditeur vérifié dans Brevo
        sync: false
      - key: MAIL_FROM_NAME
        value: KBForms
      - key: RECAPTCHA_SITE_KEY     # clés reCAPTCHA v2 pour le domaine onrender.com ; laisser vide pour désactiver
        sync: false
      - key: RECAPTCHA_SECRET_KEY
        sync: false
