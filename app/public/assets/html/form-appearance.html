<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apparence · KBForms</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/kbforms.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&display=swap&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body class="overflow-hidden">
  <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>
  <div id="sidebar-mount"></div>

  <!-- Layout plein écran : panneau gauche + préview droite -->
  <div class="md:pl-60 h-screen flex flex-col">
    <div id="topbar-mount"></div>

    <div class="flex flex-1 overflow-hidden">

      <!-- ── Panneau contrôles ──────────────────────────────────── -->
      <aside class="w-72 shrink-0 bg-white border-r border-gray-200 flex flex-col overflow-y-auto">

        <!-- Sélecteur de formulaire -->
        <div class="p-4 border-b border-gray-100">
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Formulaire</label>
          <select id="form-select" class="kb-input text-sm" onchange="loadTheme()">
            <option value="">— Choisir un formulaire —</option>
          </select>
        </div>

        <!-- Contrôles thème -->
        <div class="p-4 space-y-5 flex-1" id="controls">
          <div class="kb-empty">
            <div class="kb-empty-icon flex justify-center text-gray-300"><svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-.5-1.5-.5-2 .5-1 1.5-1H18a3 3 0 0 0 3-3 8 8 0 0 0-9-7Z"/><circle cx="8" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="10" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="14" cy="8" r="1.2" fill="currentColor" stroke="none"/></svg></div>
            <div class="kb-empty-title">Sélectionnez un formulaire</div>
            <div class="kb-empty-desc">Le thème apparaîtra ici</div>
          </div>
        </div>

        <!-- Pied : bouton sauvegarder -->
        <div class="p-4 border-t border-gray-100 hidden" id="save-bar">
          <button onclick="saveTheme()" class="kb-btn kb-btn-primary w-full justify-center gap-1.5" id="save-btn">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 4v5h7V4M8 21v-6h8v6"/></svg>
            Sauvegarder le thème
          </button>
          <button onclick="resetTheme()" class="kb-btn kb-btn-ghost w-full justify-center gap-1.5 mt-2 text-xs">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2"/><path d="M20 4v4h-4M4 20v-4h4"/></svg>
            Réinitialiser
          </button>
        </div>
      </aside>

      <!-- ── Préview ─────────────────────────────────────────────── -->
      <main class="flex-1 bg-gray-100 flex flex-col overflow-hidden">

        <!-- Toolbar préview -->
        <div class="bg-white border-b border-gray-200 px-4 py-2 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-2">
            <span class="text-xs font-medium text-gray-500">Aperçu ·</span>
            <div class="flex gap-1 bg-gray-100 rounded-lg p-0.5">
              <button onclick="setViewport('desktop')" id="vp-desktop"
                class="vp-btn active px-2 py-1 rounded" title="Desktop" aria-label="Desktop"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
              <button onclick="setViewport('tablet')" id="vp-tablet"
                class="vp-btn px-2 py-1 rounded" title="Tablette" aria-label="Tablette"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M12 17h.01"/></svg></button>
              <button onclick="setViewport('mobile')" id="vp-mobile"
                class="vp-btn px-2 py-1 rounded" title="Mobile" aria-label="Mobile"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></svg></button>
            </div>
          </div>
          <div id="unsaved-badge" class="hidden">
            <span class="kb-badge kb-badge-amber">● Modifications non sauvegardées</span>
          </div>
          <a id="open-link" href="#" target="_blank"
            class="text-xs text-indigo-600 font-medium hover:underline hidden inline-flex items-center gap-1">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
            Ouvrir le formulaire
          </a>
        </div>

        <!-- Iframe préview -->
        <div class="flex-1 flex items-start justify-center overflow-auto py-6 px-4" id="preview-area">
          <div class="kb-empty mt-20">
            <div class="kb-empty-icon flex justify-center text-gray-300"><svg class="w-10 h-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
            <div class="kb-empty-title">Choisissez un formulaire</div>
            <div class="kb-empty-desc">L'aperçu s'affichera ici en temps réel</div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <style>
    .vp-btn { transition: background .15s, color .15s; color: #6b7280; }
    .vp-btn.active { background: white; color: #4f46e5; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .color-swatch {
      width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent;
      cursor: pointer; transition: transform .15s, border-color .15s;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.selected { border-color: #4f46e5; }
    input[type=range] { accent-color: #6366f1; }
    .control-label {
      display: block; font-size: .75rem; font-weight: 600;
      color: #6b7280; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .4rem;
    }
  </style>

  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/sidebar.js"></script>
  <script>
    let formId   = null;
    let formData = null;
    let theme    = {};
    let viewport = 'desktop';
    let isDirty  = false;

    const PRESETS = [
      '#4F46E5','#7C3AED','#DB2777','#DC2626',
      '#EA580C','#D97706','#16A34A','#0891B2',
      '#0284C7','#1D4ED8','#374151','#111827',
    ];

    const FONTS = ['Inter', 'Plus Jakarta Sans', 'Roboto'];

    const VP_WIDTHS = { desktop: '100%', tablet: '768px', mobile: '390px' };

    if (KBF_AUTH.requireAuth()) {
      renderSidebar('');
      renderTopBar({ title: 'Apparence', actions: '' });
      init();
    }

    async function init() {
      const user = KBF_AUTH.getUser();
      const { ok, data } = await KBF_API.get(`/users/${user.id}/forms`);
      const forms = ok ? (Array.isArray(data) ? data : (data?.forms || [])) : [];

      const sel = document.getElementById('form-select');
      forms.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.id;
        opt.textContent = f.title || 'Sans titre';
        sel.appendChild(opt);
      });

      // Pré-sélectionner depuis l'URL ?id=
      const urlId = getQueryParam('id');
      if (urlId) {
        sel.value = urlId;
        loadTheme();
      }
    }

    async function loadTheme() {
      formId = document.getElementById('form-select').value;
      if (!formId) return;

      history.replaceState(null, '', `?id=${formId}`);

      // Charger les données du formulaire
      const r1 = await KBF_API.get(`/forms/${formId}`);
      formData = r1.ok ? (r1.data?.form || r1.data) : {};

      // Charger le thème
      const r2 = await KBF_API.get(`/forms/${formId}/theme`);
      theme = r2.ok ? (r2.data?.theme || r2.data || {}) : {};

      isDirty = false;
      renderControls();
      renderPreview();
      document.getElementById('save-bar').classList.remove('hidden');
      document.getElementById('unsaved-badge').classList.add('hidden');

      const link = document.getElementById('open-link');
      link.href = `/f/${formData?.share_token || formId}`;
      link.classList.remove('hidden');
    }

    // ── Contrôles ─────────────────────────────────────────────────────────────
    function renderControls() {
      const t = theme;
      document.getElementById('controls').innerHTML = `

        <!-- Couleur principale -->
        <div>
          <span class="control-label">Couleur principale</span>
          <div class="flex flex-wrap gap-2 mb-2">
            ${PRESETS.map(c => `
              <button class="color-swatch ${(t.theme_color||'#4F46E5').toLowerCase()===c.toLowerCase()?'selected':''}"
                style="background:${c}" onclick="setColor('${c}')" title="${c}"></button>
            `).join('')}
          </div>
          <input type="color" id="t-color" value="${t.theme_color || '#4F46E5'}"
            oninput="setColor(this.value)" class="w-full h-9 rounded-lg border border-gray-200 cursor-pointer">
        </div>

        <!-- Fond -->
        <div>
          <span class="control-label">Couleur de fond</span>
          <div class="flex gap-2">
            ${['#FFFFFF','#F9FAFB','#F0F4FF','#FFF7ED','#F0FDF4','#FDF4FF'].map(c => `
              <button class="color-swatch border border-gray-200 ${(t.bg_color||'#FFFFFF').toLowerCase()===c.toLowerCase()?'selected':''}"
                style="background:${c}" onclick="setBg('${c}')" title="${c}"></button>
            `).join('')}
          </div>
        </div>

        <!-- Image d'en-tête -->
        <div>
          <span class="control-label">Image d'en-tête (URL)</span>
          <input id="t-img" type="url" class="kb-input text-sm"
            placeholder="https://..." value="${escapeHtml(t.header_image || '')}"
            oninput="markDirty(); renderPreview()">
        </div>

        <!-- Police -->
        <div>
          <span class="control-label">Police</span>
          <div class="space-y-1">
            ${FONTS.map(f => `
              <label class="flex items-center gap-2 cursor-pointer p-2 rounded-lg hover:bg-gray-50 border border-transparent ${(t.font_family||'Inter')===f?'border-indigo-200 bg-indigo-50':''}">
                <input type="radio" name="t-font" value="${f}" ${(t.font_family||'Inter')===f?'checked':''}
                  onchange="setFont('${f}')" class="accent-indigo-600">
                <span class="text-sm" style="font-family:'${f}'">${f}</span>
              </label>
            `).join('')}
          </div>
        </div>

        <!-- Taille de texte -->
        <div>
          <span class="control-label">Taille du texte — <span id="t-size-val">${t.font_size || 14}</span>px</span>
          <input type="range" id="t-size" min="12" max="20" step="1"
            value="${t.font_size || 14}" oninput="setSize(this.value)" class="w-full">
          <div class="flex justify-between text-xs text-gray-400 mt-0.5"><span>12</span><span>20</span></div>
        </div>

        <!-- Coins arrondis -->
        <div>
          <span class="control-label">Coins des champs</span>
          <div class="flex gap-2">
            ${[{v:'0',label:'Carré'},{v:'6',label:'Léger'},{v:'12',label:'Arrondi'},{v:'999',label:'Pill'}].map(r => `
              <button onclick="setRadius('${r.v}')"
                class="flex-1 text-xs py-2 border rounded-lg font-medium transition
                  ${(t.border_radius||'6')===r.v ? 'border-indigo-400 bg-indigo-50 text-indigo-700' : 'border-gray-200 text-gray-600 hover:bg-gray-50'}"
                style="border-radius:${Math.min(r.v,12)}px">
                ${r.label}
              </button>
            `).join('')}
          </div>
        </div>`;
    }

    // ── Setters (màj theme + preview immédiat) ────────────────────────────────
    function setColor(c) {
      theme.theme_color = c;
      document.getElementById('t-color').value = c;
      document.querySelectorAll('.color-swatch').forEach(el => {
        el.classList.toggle('selected', el.style.background === c || el.title === c);
      });
      markDirty(); renderPreview();
    }

    function setBg(c) {
      theme.bg_color = c;
      document.querySelectorAll('.color-swatch').forEach((el, i) => {
        if (i >= PRESETS.length) el.classList.toggle('selected', el.title === c);
      });
      markDirty(); renderPreview();
    }

    function setFont(f) {
      theme.font_family = f;
      markDirty(); renderPreview();
    }

    function setSize(v) {
      theme.font_size = Number(v);
      document.getElementById('t-size-val').textContent = v;
      markDirty(); renderPreview();
    }

    function setRadius(v) {
      theme.border_radius = v;
      // Re-render controls pour refléter la sélection
      renderControls();
      markDirty(); renderPreview();
    }

    function markDirty() {
      if (!isDirty) {
        isDirty = true;
        document.getElementById('unsaved-badge').classList.remove('hidden');
      }
    }

    // ── Préview iframe ─────────────────────────────────────────────────────────
    function renderPreview() {
      if (!formData) return;
      const t = theme;
      const color  = t.theme_color  || '#4F46E5';
      const bg     = t.bg_color     || '#FFFFFF';
      const font   = t.font_family  || 'Inter';
      const size   = t.font_size    || 14;
      const radius = t.border_radius || '6';
      const img    = document.getElementById('t-img')?.value || t.header_image || '';

      const questions = [
        { type: 'short_text', label: 'Votre nom' },
        { type: 'radio',      label: 'Option préférée', options: ['Option A', 'Option B', 'Option C'] },
        { type: 'long_text',  label: 'Commentaire' },
      ];

      const qHTML = questions.map(q => {
        let field = '';
        if (q.type === 'short_text') {
          field = `<input disabled placeholder="Votre réponse…"
            style="width:100%;padding:.5rem .75rem;border:1px solid #e5e7eb;border-radius:${radius}px;font-family:'${font}';font-size:${size}px;background:#f9fafb">`;
        } else if (q.type === 'radio') {
          field = q.options.map(o => `
            <label style="display:flex;align-items:center;gap:.5rem;font-size:${size}px;font-family:'${font}';color:#374151;margin-bottom:.3rem;cursor:pointer">
              <span style="width:16px;height:16px;border:2px solid ${color};border-radius:50%;display:inline-block;shrink:0"></span>
              ${o}
            </label>`).join('');
        } else if (q.type === 'long_text') {
          field = `<textarea disabled placeholder="Votre réponse…" rows="3"
            style="width:100%;padding:.5rem .75rem;border:1px solid #e5e7eb;border-radius:${radius}px;font-family:'${font}';font-size:${size}px;background:#f9fafb;resize:none"></textarea>`;
        }
        return `
          <div style="margin-bottom:1.25rem">
            <p style="font-size:${size}px;font-family:'${font}';font-weight:600;color:#111827;margin-bottom:.4rem">${escapeHtml(q.label)}</p>
            ${field}
          </div>`;
      }).join('');

      const html = `<!DOCTYPE html><html><head>
        <meta charset="UTF-8">
        <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Inter:wght@400;500;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
        <style>*{box-sizing:border-box;margin:0;padding:0}body{background:${bg};font-family:'${font}',sans-serif;}</style>
      </head><body>
        <div style="max-width:640px;margin:2rem auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08)">
          ${img ? `<img src="${escapeHtml(img)}" style="width:100%;height:160px;object-fit:cover" onerror="this.style.display='none'">` : ''}
          <div style="height:6px;background:${color}"></div>
          <div style="padding:2rem">
            <h1 style="font-family:'${font}',sans-serif;font-size:${Math.round(size*1.5)}px;font-weight:700;color:#111827;margin-bottom:.5rem">
              ${escapeHtml(formData?.title || 'Titre du formulaire')}
            </h1>
            ${formData?.description ? `<p style="font-size:${size}px;color:#6b7280;margin-bottom:1.5rem">${escapeHtml(formData.description)}</p>` : '<div style="margin-bottom:1.5rem"></div>'}
            ${qHTML}
            <button disabled style="background:${color};color:#fff;padding:.6rem 1.5rem;border:none;border-radius:${radius}px;font-family:'${font}',sans-serif;font-size:${size}px;font-weight:600;cursor:pointer;opacity:.9">
              Envoyer
            </button>
          </div>
        </div>
      </body></html>`;

      const area = document.getElementById('preview-area');
      area.innerHTML = '';

      const wrapper = document.createElement('div');
      wrapper.style.cssText = `width:${VP_WIDTHS[viewport]};max-width:100%;transition:width .3s;`;

      const iframe = document.createElement('iframe');
      iframe.style.cssText = 'width:100%;height:700px;border:none;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,.12);background:#fff';
      iframe.srcdoc = html;
      wrapper.appendChild(iframe);
      area.appendChild(wrapper);
    }

    // ── Viewport ───────────────────────────────────────────────────────────────
    function setViewport(vp) {
      viewport = vp;
      ['desktop','tablet','mobile'].forEach(v => {
        document.getElementById('vp-' + v).classList.toggle('active', v === vp);
      });
      renderPreview();
    }

    // ── Sauvegarde ─────────────────────────────────────────────────────────────
    async function saveTheme() {
      if (!formId) return;
      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = 'Sauvegarde…';

      const body = {
        theme_color:   theme.theme_color   || '#4F46E5',
        bg_color:      theme.bg_color      || '#FFFFFF',
        header_image:  document.getElementById('t-img')?.value || null,
        font_family:   theme.font_family   || 'Inter',
        font_size:     theme.font_size     || 14,
        border_radius: theme.border_radius || '6',
      };

      const { ok, data } = await KBF_API.patch(`/forms/${formId}/theme`, body);
      btn.disabled = false;
      btn.innerHTML = '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Z"/><path d="M8 4v5h7V4M8 21v-6h8v6"/></svg> Sauvegarder le thème';

      if (ok) {
        theme = { ...theme, ...body };
        isDirty = false;
        document.getElementById('unsaved-badge').classList.add('hidden');
        showToast('Thème sauvegardé');
      } else {
        showToast(data?.error || 'Erreur lors de la sauvegarde', 'error');
      }
    }

    async function resetTheme() {
      if (!formId) return;
      if (!confirm('Réinitialiser le thème aux valeurs par défaut ?')) return;
      const defaults = { theme_color: '#4F46E5', bg_color: '#FFFFFF', font_family: 'Inter', font_size: 14, border_radius: '6', header_image: null };
      const { ok } = await KBF_API.patch(`/forms/${formId}/theme`, defaults);
      if (ok) {
        theme = { ...defaults };
        isDirty = false;
        document.getElementById('unsaved-badge').classList.add('hidden');
        renderControls();
        renderPreview();
        showToast('Thème réinitialisé');
      } else {
        showToast('Erreur', 'error');
      }
    }

    // Confirmation si modifications non sauvegardées
    window.addEventListener('beforeunload', e => {
      if (isDirty) { e.preventDefault(); e.returnValue = ''; }
    });
  </script>
</body>
</html>
